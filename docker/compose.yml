# Production stack for Dokploy (Compose app). Postgres is external (your server):
# set DATABASE_URL in Dokploy's environment tab.
name: plunderclips
services:
  migrate:
    build: { context: .., dockerfile: docker/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"
  web:
    build: { context: .., dockerfile: docker/Dockerfile, target: runner }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    expose: ["3000"]
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  redisdata:
