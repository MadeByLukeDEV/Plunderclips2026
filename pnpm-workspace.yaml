packages:
  - apps/*
  - packages/*
  - packages/modules/*

allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.11'
  - '@turbo/darwin-arm64@2.11.11'
  - '@turbo/linux-64@2.11.11'
  - '@turbo/linux-arm64@2.11.11'
  - '@turbo/windows-64@2.11.11'
  - '@turbo/windows-arm64@2.11.11'
  - turbo@2.11.11
  - postgres@4.1.1
